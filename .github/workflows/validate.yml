name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data and repository contracts
        run: python3 scripts/validate_repository.py
      - name: Run migration tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reject high-severity production dependency findings
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: Validate web types and lint
        working-directory: web
        run: npm run lint && npx tsc --noEmit
      - name: Build and test server-rendered routes
        working-directory: web
        run: npm test
