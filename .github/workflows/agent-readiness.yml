name: Agent readiness check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository-owned agent contracts
        run: python3 scripts/validate_repository.py
      - name: Confirm safe default
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("agent/config/agent.json").read_text())
          assert config["enabled"] is True
          assert config["mode"] == "dry_run"
          assert config["stage"] == "policy_readiness"
          assert config["external_research_enabled"] is False
          assert config["publication_enabled"] is False
          assert config["human_review_required"] is True
          print("Policy runner is active; external research and publication are disabled.")
          PY
