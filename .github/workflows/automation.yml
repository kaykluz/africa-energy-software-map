name: Safe automation

on:
  workflow_dispatch:
    inputs:
      maintenance:
        description: Run private retention maintenance
        required: true
        default: true
        type: boolean
      research_readiness:
        description: Run proposal-only research preparation
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "15 4 * * *"
    - cron: "45 4 * * 1"

permissions:
  contents: read

jobs:
  maintenance:
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '15 4 * * *' ||
      github.event_name == 'workflow_dispatch' && inputs.maintenance
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.AEM_SITE_URL }}
      OPERATIONS_TOKEN: ${{ secrets.AEM_OPERATIONS_TOKEN }}
      SITES_BYPASS_TOKEN: ${{ secrets.AEM_SITES_BYPASS_TOKEN }}
    steps:
      - name: Run retention and queue-health pass
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SITE_URL" || -z "$OPERATIONS_TOKEN" || -z "$SITES_BYPASS_TOKEN" ]]; then
            echo "::notice::Maintenance secrets are not configured yet."
            exit 0
          fi
          response="$(
            curl --fail --silent --show-error --retry 2 \
              --request POST \
              --header "Authorization: Bearer $OPERATIONS_TOKEN" \
              --header "OAI-Sites-Authorization: Bearer $SITES_BYPASS_TOKEN" \
              "$SITE_URL/api/operations/maintenance"
          )"
          MAINTENANCE_RESPONSE="$response" python3 - <<'PY'
          import json
          import os
          report = json.loads(os.environ["MAINTENANCE_RESPONSE"])
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a", encoding="utf-8") as handle:
              handle.write("## Maintenance completed\n\n")
              handle.write(f"- Expired contacts deleted: {report['expiredContactsDeleted']}\n")
              handle.write(f"- Old rate counters deleted: {report['expiredRateLimitsDeleted']}\n")
              handle.write(f"- Open contributions: {report['openContributions']}\n")
          PY

  research-readiness:
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '45 4 * * 1' ||
      github.event_name == 'workflow_dispatch' && inputs.research_readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate proposal-only preparation
        run: |
          python3 scripts/validate_repository.py
          python3 scripts/build_review_assist.py --check
          python3 scripts/prepare_next_batch.py --check
      - name: Run policy-only agent and scale checks
        run: |
          mkdir -p automation-artifacts
          python3 scripts/run_agent_dry_run.py \
            --output automation-artifacts/agent-run.json
          python3 scripts/check_launch_readiness.py \
            --output automation-artifacts/launch-readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: safe-automation-${{ github.run_id }}
          path: automation-artifacts/
          if-no-files-found: error
          retention-days: 30
