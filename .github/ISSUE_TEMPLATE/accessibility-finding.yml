name: Accessibility test finding
description: Record a de-identified barrier found in moderated or manual testing.
title: "[Accessibility]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include participant names, contact details, recordings, health information or sensitive infrastructure data.
  - type: input
    id: version
    attributes:
      label: Site version and route
      description: Include the tested release or commit and page path.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocker
        - High
        - Moderate
        - Low
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Browser, device and assistive technology
      description: Include zoom, reduced motion, viewport or connection treatment where relevant.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task and expected behaviour
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed barrier and access impact
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: session
    attributes:
      label: Private session ID
      description: Optional de-identified reference only.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This issue contains no participant identity, private recording, health history or sensitive infrastructure information.
          required: true
